<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>签到工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    color-scheme: light;
    --font-ui: system-ui, -apple-system, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC",
               "Source Han Sans SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    --bg: #EDF0F4;
    --card: #FFFFFF;
    --sidebar: #F6F8FA;
    --ink: #1E2A32;
    --muted: #66757F;
    --border: #D9E0E7;
    --hover: rgba(30,42,50,.045);
    --accent: #1E88E5;
    --accent-strong: #1565C0;
    --accent-soft: #E6F2FD;
    --ok: #178A52;   --ok-glow: rgba(23,138,82,.16);  --ok-border: rgba(23,138,82,.35);
    --warn: #B7791F;  --warn-bg: #FDF3E0;
    --err: #C93A3A;
    --shadow: 0 1px 2px rgba(16,26,36,.05), 0 10px 28px rgba(16,26,36,.06);
    --radius: 12px;
    --focus: 0 0 0 3px rgba(30,136,229,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0E141B; --card: #151E27; --sidebar: #111B24;
      --ink: #E7EDF2; --muted: #8B98A4; --border: #263140;
      --hover: rgba(231,237,242,.055);
      --accent: #4DA8FF; --accent-strong: #7AB8FF;
      --accent-soft: rgba(77,168,255,.14);
      --ok: #34C07B; --ok-glow: rgba(52,192,123,.2); --ok-border: rgba(52,192,123,.45);
      --warn: #E8B64C; --warn-bg: rgba(232,182,76,.12);
      --err: #F06558;
      --shadow: 0 1px 2px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.38);
      --focus: 0 0 0 3px rgba(77,168,255,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: none; box-shadow: var(--focus); border-radius: 8px; }
  ::selection { background: var(--accent-soft); }
  .muted { color: var(--muted); font-size: 12.5px; }
  .ok { color: var(--ok); }
  .err { color: var(--err); font-size: 12.5px; margin: 10px 0 0; }

  /* ---------- 骨架（对齐 115网盘助手） ---------- */
  .app { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
  .main { min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 20px 28px 0; }
  .page-title { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .content { padding: 16px 28px 44px; min-width: 0; }

  /* ---------- 侧栏 ---------- */
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
             padding: 18px 12px 14px; background: var(--sidebar); border-right: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
  .brand-mark { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
                flex: none; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .5px;
                background: linear-gradient(135deg, var(--accent), #0D4FA8);
                box-shadow: 0 3px 10px rgba(30,136,229,.35); }
  .brand-name { font-weight: 700; font-size: 14.5px; letter-spacing: .2px; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav button { position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
                padding: 9px 10px; border: 0; background: transparent; color: var(--ink);
                border-radius: 9px; font-size: 13.5px; text-align: left; cursor: pointer;
                transition: background .12s ease, color .12s ease; }
  .nav button svg { width: 17px; height: 17px; flex: none; color: var(--muted);
                    transition: color .12s ease; }
  .nav button:hover { background: var(--hover); }
  .nav button:hover svg { color: var(--ink); }
  .nav button.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .nav button.active svg { color: var(--accent); }
  .nav button.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px;
                               width: 3px; border-radius: 2px; background: var(--accent); }
  .sidebar-foot { display: flex; justify-content: space-between; align-items: center;
                  padding: 12px 8px 0; border-top: 1px solid var(--border);
                  color: var(--muted); font-size: 11px; }
  .sidebar-foot .btn-mini { font-size: 11px; padding: 2px 8px; }
  .sidebar-foot-status { padding: 6px 8px 8px; font-size: 11px; color: var(--muted);
                         text-align: center; line-height: 1.5; }
  .sidebar-foot-status.ok { color: var(--ok); }
  .sidebar-foot-status.warn { color: var(--accent-strong); }
  .ver { font-family: var(--font-mono); }

  /* ---------- 状态芯片 ---------- */
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px;
          font-size: 12px; color: var(--muted); background: var(--card);
          border: 1px solid var(--border); border-radius: 999px; white-space: nowrap;
          font-variant-numeric: tabular-nums; transition: color .15s ease, border-color .15s ease; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .chip.on { color: var(--ok); border-color: var(--ok-border); }
  .chip.on::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-glow); }

  /* ---------- 卡片与工具条 ---------- */
  .pane { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
          padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .field-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .field-row .input { flex: 1; min-width: 200px; }
  .settings-row { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 160px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
         border: 1px solid var(--border); border-radius: 8px; background: var(--card);
         color: var(--ink); font-size: 13px; cursor: pointer;
         transition: border-color .12s ease, color .12s ease, background .12s ease, transform .05s ease; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  .btn.btn-mini { padding: 3px 8px; font-size: 12px; gap: 4px; }

  /* ---------- 表单 ---------- */
  .input { width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px;
           background: var(--card); color: var(--ink); font-size: 13px;
           transition: border-color .12s ease; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
  .input.mono, .mono { font-family: var(--font-mono); font-size: 12.5px; }

  /* ---------- 设置分组与开关 ---------- */
  .settings-group { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .settings-group > header { padding: 9px 14px; background: var(--bg); border-bottom: 1px solid var(--border);
                             color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .6px; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                 padding: 12px 14px; }
  .setting-row + .setting-row { border-top: 1px solid var(--border); }
  .setting-label { font-size: 13.5px; font-weight: 500; }
  .setting-desc { margin-top: 1px; color: var(--muted); font-size: 12px; }
  .setting-row .input.mono { flex: 1; max-width: 200px; }
  .switch { position: relative; display: inline-flex; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
                  opacity: 0; cursor: pointer; }
  .switch .track { position: relative; width: 38px; height: 22px; border-radius: 999px;
                   background: var(--border); transition: background .15s ease; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                          border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
                          transition: transform .15s ease; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch input:focus-visible + .track { box-shadow: var(--focus); }

  /* ---------- 空状态 ---------- */
  .empty { padding: 34px 12px 28px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty::before { content: "▦"; display: block; margin-bottom: 8px; font-size: 26px;
                   color: var(--accent); opacity: .5; }

  /* ---------- 引导横幅 ---------- */
  .guide { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; margin-bottom: 14px;
           border: 1px solid var(--warn); border-radius: 10px; background: var(--warn-bg);
           font-size: 13px; line-height: 1.6; }
  .guide b { color: var(--warn); }

  /* ---------- 站点卡片 ---------- */
  .site { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 12px;
          background: var(--card); box-shadow: var(--shadow); }
  .site-head { display: flex; align-items: center; gap: 11px; padding: 13px 15px 0; }
  .site-tag { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center;
              font-weight: 800; font-size: 13px; color: #fff; }
  .site-tag.t1 { background: linear-gradient(135deg,#1E88E5,#0D4FA8); }
  .site-tag.t2 { background: linear-gradient(135deg,#F5A623,#C77C0A); }
  .site-tag.t3 { background: linear-gradient(135deg,#20B08A,#0C7A5F); }
  .site-tag.t4 { background: linear-gradient(135deg,#7B4FE0,#4A2B9E); }
  .site-name { font-weight: 700; font-size: 14.5px; }
  .site-desc { font-size: 11.5px; color: var(--muted); }
  .badge { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { color: var(--ok); background: var(--ok-glow); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .site-body { padding: 10px 15px 14px; }
  .site-body .creds-title { font-size: 12.5px; font-weight: 600; margin-top: 4px; }
  .site-body .creds-title .hint { font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .site-ops { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .site-toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
                 padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px;
                 background: transparent; color: var(--muted); cursor: pointer;
                 transition: color .12s ease, border-color .12s ease; }
  .site-toggle.ready { color: var(--ok); border-color: var(--ok-border); }
  .site-toggle:hover { color: var(--accent-strong); border-color: var(--accent); }
  .site-body[hidden] { display: none; }
  .res-line { font-size: 12.5px; margin-top: 9px; }
  .res-line.ok { color: var(--ok); }
  .res-line.err { color: var(--err); }

  /* ---------- 历史 ---------- */
  .hist-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
               border-bottom: 1px dashed var(--border); font-size: 13px; }
  .hist-item:last-child { border-bottom: none; }
  .hist-st { flex: none; min-width: 74px; text-align: center; border-radius: 5px; padding: 1px 6px; font-size: 12px; }
  .hist-st.ok { color: var(--ok); background: var(--ok-glow); }
  .hist-st.dup { color: var(--warn); background: var(--warn-bg); }
  .hist-st.err { color: var(--err); background: rgba(201,58,58,.1); }
  .hist-msg { flex: 1; min-width: 0; word-break: break-all; }
  .hist-tm { flex: none; color: var(--muted); font-size: 11px; font-family: var(--font-mono); }

  /* ---------- 结果摘要 ---------- */
  .summary-line { margin-top: 10px; white-space: pre-line; font-size: 13px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 50; width: 62px; padding: 14px 8px 12px; }
    .brand { justify-content: center; padding: 0 0 16px; }
    .brand-name, .brand-sub { display: none; }
    .nav button { justify-content: center; padding: 10px; }
    .nav button span { display: none; }
    .sidebar-foot .ver { font-size: 10px; }
    .sidebar-foot .btn-mini { display: none; }
    .main { margin-left: 62px; }
    .topbar { padding: 14px 14px 0; }
    .content { padding: 12px 14px 40px; }
    .page-title { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">签</div>
      <div>
        <div class="brand-name">签到工具</div>
        <div class="brand-sub">FLZT · 恩山 · 易破解</div>
      </div>
    </div>
    <nav class="nav" id="tabs" aria-label="主导航">
      <button data-tab="sites" class="active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 2-1 3-2.5 3H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>站点签到</span>
      </button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.5a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.5a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        <span>运行设置</span>
      </button>
      <button data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h9v12h-9M6 6v9"/><path d="M9 6v9"/><path d="M12 6v9"/><path d="M15 6v9"/></svg>
        <span>日志</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <span class="ver" id="appVersion">v1.0.0</span>
      <button class="btn btn-mini" id="hotfixMiniBtn" onclick="hotfixMiniClick()" title="检查并应用功能更新（免 fpk）">检查功能更新</button>
    </div>
    <div class="sidebar-foot-status" id="hotfixMiniStatus" hidden></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 class="page-title" id="pageTitle">站点签到</h1>
      <span style="flex:1"></span>
      <span class="chip" id="appChip"><span id="appChipText">加载中…</span></span>
    </header>
    <div class="content">

      <!-- 站点签到 -->
      <section id="tab-sites">
        <div class="guide" id="guide" hidden>
          <div><b>⚠ 以下站点尚未配置凭据：</b><span id="guideSites"></span>
          <br><span class="muted">在下方对应站点内填写（FLZT / 易破解：账号+密码；恩山：Cookie），然后点「测试连接」。</span></div>
        </div>
        <div class="toolbar">
          <button class="btn primary" onclick="runAll()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M21 8a9 9 0 1 0 1 7"/></svg>
            立即签到全部
          </button>
          <span class="muted" id="runSummary"></span>
          <span style="flex:1"></span>
          <span class="muted" id="runStatus"></span>
        </div>
        <div id="siteCards"></div>
        <div class="summary-line" id="runResult"></div>
      </section>

      <!-- 运行设置 -->
      <section id="tab-settings" hidden>
        <div class="pane">
          <div class="settings-group">
            <header>自动运行</header>
            <div class="setting-row">
              <div><div class="setting-label">自动签到</div><div class="setting-desc">开启后按每日时刻自动签到，错过自动补签</div></div>
              <label class="switch"><input type="checkbox" id="cfgEnabled"><span class="track"></span></label>
            </div>
            <div class="setting-row">
              <div><div class="setting-label">每日时刻</div><div class="setting-desc">HH:MM，错过整点后每 30 分钟补签，当天最多 5 次</div></div>
              <input class="input mono" type="text" id="cfgCron" placeholder="08:10" style="max-width:130px">
            </div>
            <div class="setting-row">
              <div><div class="setting-label">失败重试</div><div class="setting-desc">站点失败时的重试次数（1-10）</div></div>
              <input class="input mono" type="text" id="cfgRetry" placeholder="3" style="max-width:110px">
            </div>
          </div>
          <div class="settings-group">
            <header>通知</header>
            <div class="setting-row">
              <div><div class="setting-label">飞书通知</div><div class="setting-desc">签到结果推送到飞书机器人</div></div>
              <label class="switch"><input type="checkbox" id="cfgNotify"><span class="track"></span></label>
            </div>
            <div class="setting-row">
              <div><div class="setting-label">Webhook 地址</div><div class="setting-desc">已配置请留空</div></div>
              <input type="password" class="input mono" id="cfgWebhook" placeholder="https://open.feishu.cn/…" style="max-width:260px">
            </div>
          </div>
          <div class="settings-row">
            <span class="muted" id="cfgStatus"></span>
            <button class="btn primary" id="cfgSaveBtn" onclick="saveSettings()">保存设置</button>
          </div>
        </div>
      </section>

      <!-- 日志 -->
      <section id="tab-history" hidden>
        <div class="pane" style="padding:0;overflow:hidden">
          <div class="toolbar" style="margin:0;padding:10px 14px 0;border-bottom:none">
            <span style="font-weight:600;font-size:13.5px">运行日志</span>
            <span class="muted" id="logMeta"></span>
            <span style="flex:1"></span>
            <button class="btn btn-mini" id="logPauseBtn" onclick="logTogglePause()">暂停</button>
            <button class="btn btn-mini" onclick="logClear()">清空日志</button>
          </div>
          <pre id="logView" style="margin:0;padding:12px 14px;height:62vh;overflow:auto;background:#0C1218;color:#D7E3EC;font:12px/1.6 var(--font-mono);white-space:pre-wrap;word-break:break-all;tab-size:2"></pre>
        </div>
      </section>

    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
// 对齐 115网盘助手：API 走 fnOS 网关 /app/checkin/action/<name> 通道
const API_BASE = "/app/checkin/action/";
async function call(action, method = "GET", body = null, timeoutMs = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const opt = { method, headers: { Accept: "application/json" }, signal: ctrl.signal };
    if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    const r = await fetch(API_BASE + action, opt);
    try { return await r.json(); }
    catch {
      try {
        const t = await r.text();
        const low = t.slice(0, 300).toLowerCase();
        if (/invalid token|login|signin|登录|认证|unauthoriz|401|403/.test(low)) return { success: false, message: "登录会话已过期，请重新登录飞牛系统后重试" };
        if (low.startsWith("<!doctype") || low.startsWith("<html")) return { success: false, message: "网关返回了页面（非数据），请刷新并确认已登录" };
      } catch { /* 读不到正文 */ }
      return { success: false, message: "响应解析失败" };
    }
  } catch { return { success: false, message: "请求超时或网络异常" }; }
  finally { clearTimeout(timer); }
}

const TITLES = { sites: "站点签到", settings: "运行设置", history: "日志" };

/* ── 站点定义（配置项对齐上游插件：enabled / use_proxy / 凭据）── */
const SITES = {
  flzt: {
    name: "FLZT", tag: "t1", short: "FL", mode: "账号密码",

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderSiteCards(serverSites) {
  const box = $("siteCards");
  box.innerHTML = "";
  for (const [key, info] of Object.entries(SITES)) {
    const st = (serverSites && serverSites[key]) || {};
    const accs = (st.accounts || []).map((a) => ({ ...a, key }));
    const cfgCount = accs.filter((a) => a.configured).length;
    const badge = st.configured
      ? `<span class="badge ok">${cfgCount} 个账号</span>`
      : '<span class="badge warn">⚠ 未配置凭据</span>';
    const toggleBtn = st.configured
      ? `<button class="site-toggle ready" id="tg_${key}" onclick="toggleSite('${key}')">${st.enabled ? "已启用" : "已配置"} · 管理账号</button>`
      : `<button class="site-toggle" id="tg_${key}" onclick="toggleSite('${key}')">展开配置</button>`;
    box.insertAdjacentHTML("beforeend", `
      <div class="site" id="card_${key}">
        <div class="site-head">
          <div class="site-tag ${info.tag}">${info.short}</div>
          <div style="min-width:0">
            <div class="site-name">${esc(info.name)}</div>
            <div class="site-desc">${esc(info.desc)}</div>
          </div>
          <span class="muted" style="border:1px solid var(--border);border-radius:4px;padding:0 6px;font-size:11px">${info.mode}</span>
          ${badge}
          <label class="switch" title="启用本站点"><input type="checkbox" id="sw_${key}" onchange="siteDirty('${key}')"><span class="track"></span></label>
        </div>
        <div class="site-body" id="body_${key}" hidden>
          <div class="creds-title">站点账号 <span class="hint">· 每个账号独立签到；凭据留空保存 = 保持当前</span></div>
          <div id="accs_${key}"></div>
          <div class="field-row" style="margin-top:8px">
            <span style="width:78px;flex:none;font-size:12.5px;color:var(--muted)">代理访问</span>
            <label class="switch"><input type="checkbox" id="px_${key}" onchange="siteDirty('${key}')"><span class="track"></span></label>
            <span class="muted">经系统代理（https_proxy / all_proxy）</span>
          </div>
          <div class="site-ops">
            <button class="btn" onclick="addAccount('${key}')">＋ 添加账号</button>
            <button class="btn" onclick="testSite('${key}')">测试全部</button>
            <button class="btn primary" onclick="runSite('${key}')">立即签到</button>
            <span class="res-line muted" id="res_${key}" style="margin-top:0"></span>
          </div>
        </div>
        <div class="site-head-foot" style="margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:flex-end">
          ${toggleBtn}
        </div>
      </div>`);
    $("sw_" + key).checked = !!st.enabled;
    $("px_" + key).checked = !!st.use_proxy;
    const accBox = $("accs_" + key);
    if (!accs.length) {
      accBox.innerHTML = '<div class="muted" style="font-size:12px;margin:6px 0">暂无账号，点击「添加账号」开始配置</div>';
    } else {
      for (const a of accs) accBox.appendChild(accountRowEl(key, info, a));
    }
  }
  // 引导横幅
  const unconfigured = Object.entries(SITES)
    .filter(([k]) => serverSites && serverSites[k] && !serverSites[k].configured)
    .map(([, i]) => i.name);
  const guide = $("guide");
  if (guide) {
    if (unconfigured.length) { $("guideSites").textContent = unconfigured.join("、"); guide.hidden = false; }
    else guide.hidden = true;
  }
}

/** 单个账号编辑区块（备注 + 启用 + 测试 + 删除 + 站点类型对应凭据字段） */
function accountRowEl(key, info, acc) {
  const div = document.createElement("div");
  div.className = "account-box";
  div.style.cssText = "border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px;background:rgba(127,127,127,.04)";
  div.dataset.aid = acc.id || "";
  div.dataset.key = key;
  const fields = info.fields.map((f) => `
      <div class="field-row" style="margin-top:7px">
        <span style="width:78px;flex:none;font-size:12.5px;color:var(--muted)">${f.label}</span>
        <input class="input mono" type="${f.type}" data-f="${f.key}" placeholder="${f.ph}" value="${esc(acc[f.key] || "")}">
      </div>`).join("");
  div.innerHTML = `
      <div class="field-row" style="align-items:center;gap:8px">
        <input class="input" style="flex:1;min-width:120px" data-f="remark" placeholder="备注（如：主账号 / 小号）" value="${esc(acc.remark || "")}">
        <span class="muted" style="font-size:11px">启用</span>
        <label class="switch"><input type="checkbox" data-f="enabled" ${acc.enabled === false ? "" : "checked"}><span class="track"></span></label>
        <button class="btn btn-mini" onclick="testAccount('${key}','${esc(acc.id || "")}')">测试</button>
        <button class="btn btn-mini" style="color:var(--danger,#f85149);border-color:var(--danger,#f85149)" onclick="removeAccount(this)">删除</button>
      </div>
      ${fields}`;
  return div;
}

/** 展开/折叠站点账号配置区 */
function toggleSite(key) {
  const body = $("body_" + key);
  if (!body) return;
  body.hidden = !body.hidden;
  const tg = $("tg_" + key);
  if (tg) tg.textContent = body.hidden ? (($("sw_" + key) && $("sw_" + key).checked) ? "已启用 · 管理账号" : "已配置 · 管理账号") : "收起配置";
}

function siteDirty(key) {
  const el = $("res_" + key);
  if (el) { el.textContent = ""; el.className = "res-line muted"; }
}

function addAccount(key) {
  const box = $("accs_" + key);
  if (!box) return;
  box.appendChild(accountRowEl(key, SITES[key], { id: "", remark: "", enabled: true }));
  siteDirty(key);
}
function removeAccount(btn) {
  const row = btn.closest(".account-box");
  if (!row) return;
  if (!confirm("删除该账号？")) return;
  row.remove();
  siteDirty(row.dataset.key);
}
/** 收集某站点全部账号（含备注/启用/凭据；密码留空由后端保留原值） */
function collectSiteAccounts(key) {
  const rows = document.querySelectorAll("#accs_" + key + " .account-box");
  const accs = [];
  rows.forEach((row) => {
    const a = { id: row.dataset.aid || "" };
    const en = row.querySelector('[data-f="enabled"]');
    a.enabled = en ? en.checked === true : true;
    const rm = row.querySelector('[data-f="remark"]');
    a.remark = rm ? rm.value.trim() : "";
    for (const f of SITES[key].fields) {
      const inp = row.querySelector('[data-f="' + f.key + '"]');
      if (inp) a[f.key] = inp.value.trim();
    }
    accs.push(a);
  });
  return accs;
}
function collectSitePatch(key) {
  return { enabled: $("sw_" + key).checked === true, use_proxy: $("px_" + key).checked === true, accounts: collectSiteAccounts(key) };
}

/* ── 加载 / 保存 ── */
async function loadAll(attempt = 1) {
  const r = await call("get_config");
  if (!r.success) {
    if (attempt < 3) { setTimeout(() => loadAll(attempt + 1), 1200); return; }
    $("siteCards").innerHTML = '<div class="empty">⚠ 加载配置失败：' + esc(r.message || "网络异常") +
      '<br><button class="btn" style="margin-top:10px" onclick="location.reload()">刷新重试</button></div>';
    $("appChipText").textContent = "加载失败";
    return;
  }
  const d = r.data;
  $("cfgEnabled").checked = !!d.enabled;
  $("cfgCron").value = d.cron || "08:10";
  $("cfgRetry").value = d.retry_count || "3";
  $("cfgNotify").checked = !!d.notify_enabled;
  $("appVersion").textContent = "v" + (d.version || "1.0.0");
  renderSiteCards(d.sites);
  updateChip(!!d.enabled);
  refreshHistory();
}
async function saveSettings() {
  const cron = $("cfgCron").value.trim();
  if (!/^\d{2}:\d{2}$/.test(cron)) { alert("每日时刻格式应为 HH:MM"); return; }
  const retry = parseInt($("cfgRetry").value.trim(), 10);
  if (!Number.isFinite(retry) || retry < 1 || retry > 10) { alert("失败重试应为 1-10 的数字"); return; }
  const sites = {};
  for (const key of Object.keys(SITES)) sites[key] = collectSitePatch(key);
  const body = {
    enabled: $("cfgEnabled").checked === true,
    cron, retry_count: retry,
    notify_enabled: $("cfgNotify").checked === true,
    sites,
  };
  const w = $("cfgWebhook").value.trim();
  if (w) body.feishu_webhook = w;
  const r = await call("save_config", "POST", body);
  const st = $("cfgStatus");
  if (r.success) {
    st.textContent = "已保存 ✓";
    $("cfgWebhook").value = "";
    setTimeout(() => { st.textContent = ""; }, 2000);
    loadAll();
  } else alert("保存失败：" + (r.message || ""));
}
function updateChip(on) {
  const chip = $("appChip");
  chip.classList.toggle("on", !!on);
  $("appChipText").textContent = on ? "自动签到已开启" : "未启用";
}

/* ── 签到执行 ── */
async function runSite(key) {
  const line = $("res_" + key);
  line.textContent = "保存配置并签到中…"; line.className = "res-line muted";
  const saved = await call("save_config", "POST", { sites: { [key]: collectSitePatch(key) } });
  if (!saved.success) { line.textContent = "✗ 配置保存失败：" + (saved.message || ""); line.className = "res-line err"; return; }
  const r = await call("run", "POST", { sites: [key] });
  const items = ((r.data || {}).results || []).filter((x) => x.site_key === key);
  if (items.length === 0) { line.textContent = r.message || "无结果（可能没有启用的账号）"; line.className = "res-line err"; }
  else {
    line.innerHTML = items.map((x) =>
      x.error ? "✗ " + ((x.account ? x.account + " " : "") + x.error)
      : (x.status === "签到成功" ? "✓ " : "○ ") + (x.account ? x.account + " " : "") + x.message).join("<br>");
    line.className = "res-line " + (items.every((x) => !x.error && x.status !== "执行失败") ? "ok" : "err");
  }
  logPoll();
  setTimeout(() => loadAll(), 800);
}
async function runAll() {
  $("runStatus").textContent = "执行中…";
  $("runResult").textContent = "";
  const r = await call("run", "POST", {});
  const data = r.data || {};
  const lines = (data.results || []).map((x) => {
    const who = x.account ? `（${x.account}）` : "";
    return x.error ? "✗ " + x.site_name + who + "：" + x.error
      : (x.status === "签到成功" ? "✓ " : "○ ") + x.site_name + who + "：" + x.message;
  });
  const allOk = (data.results || []).length > 0 && (data.results || []).every((x) => x.status !== "执行失败");
  $("runResult").textContent = lines.join("\n") || (r.message || "未执行");
  $("runResult").style.color = allOk ? "var(--ok)" : (lines.length ? "var(--err)" : "var(--muted)");
  $("runSummary").textContent = data.summary ? `${data.summary}（${data.success_count}/${data.total}）` : "";
  $("runStatus").textContent = "";
  logPoll();
}
async function testSite(key) {
  const line = $("res_" + key);
  line.textContent = "保存并测试中…"; line.className = "res-line muted";
  const saved = await call("save_config", "POST", { sites: { [key]: collectSitePatch(key) } });
  if (!saved.success) { line.textContent = "✗ 配置保存失败：" + (saved.message || ""); line.className = "res-line err"; return; }
  await loadAll();
  const rows = document.querySelectorAll("#accs_" + key + " .account-box");
  const out = [];
  for (const row of rows) {
    const id = row.dataset.aid;
    const rm = row.querySelector('[data-f="remark"]');
    const remark = rm ? rm.value.trim() : "";
    const who = remark || "账号 " + (id || "");
    if (!id) { out.push("○ " + who + "：未保存（新账号请先保存）"); continue; }
    const r = await call("test_login", "POST", { site: key, account_id: id });
    out.push((r.success ? "✓ " : "✗ ") + who + "：" + ((r.data && r.data.message) || r.message || (r.success ? "测试成功" : "测试失败")));
  }
  line.innerHTML = out.join("<br>") || "该站点没有账号";
  line.className = "res-line " + (out.length && out.every((x) => x.startsWith("✓")) ? "ok" : "");
}
async function testAccount(key, accountId) {
  const line = $("res_" + key);
  if (!accountId) { line.textContent = "请先保存配置后再测试新账号"; line.className = "res-line err"; return; }
  const r = await call("test_login", "POST", { site: key, account_id: accountId });
  line.textContent = r.success ? "✓ " + ((r.data && r.data.message) || "测试成功") : "✗ " + (r.message || "测试失败");
  line.className = "res-line " + (r.success ? "ok" : "err");
}

/* ── 实时运行日志 ── */
let logState = { offset: 0, paused: false, timer: null };
async function logPoll() {
  if (logState.paused) return;
  const r = await call("get_logs?after=" + logState.offset, "GET", null, 10000);
  const meta = $("logMeta");
  if (!r.success) { if (meta) meta.textContent = r.message; return; }
  const d = r.data || {};
  const v = $("logView");
  // 日志被清空/轮转 → 从头重读
  if (d.size < logState.offset) {
    logState.offset = 0;
    if (v) v.textContent = "";
    setTimeout(logPoll, 200);
    return;
  }
  if (v && d.lines && d.lines.length) {
    v.textContent += (v.textContent && !v.textContent.endsWith("\n") ? "\n" : "") + d.lines.join("\n");
    v.scrollTop = v.scrollHeight;
  }
  logState.offset = d.offset || d.size || 0;
  if (meta) meta.textContent = logState.offset + " B · " + (logState.paused ? "已暂停" : "实时");
}
function logTogglePause() {
  logState.paused = !logState.paused;
  $("logPauseBtn").textContent = logState.paused ? "继续" : "暂停";
  if (!logState.paused) logPoll();
}
async function logClear() {
  if (!confirm("清空全部运行日志？")) return;
  const r = await call("clear_logs", "POST", {});
  if (r.success) {
    logState.offset = 0;
    $("logView").textContent = "";
    $("logMeta").textContent = "已清空";
    setTimeout(logPoll, 300);
  } else alert("清空失败：" + (r.message || ""));
}

/* ── 热更新 ── */
let hotfixState = { has_update: false };
async function hotfixMiniClick() {
  if (hotfixState.has_update) return hotfixMiniApply();
  await hotfixMiniCheck();
}
async function hotfixMiniCheck() {
  const btn = $("hotfixMiniBtn"), st = $("hotfixMiniStatus");
  btn.disabled = true; st.hidden = false; st.textContent = "检查中…"; st.className = "";
  const r = await call("check_hotfix", "GET", null, 20000);
  const d = r.data || {};
  hotfixState.has_update = !!d.has_update;
  if (!r.success) {
    st.textContent = ((r && r.message) || (r && JSON.stringify(r) ? "网关返回异常：" + String(JSON.stringify(r)).slice(0, 140) : "检查失败")) + "，稍后重试";
    st.className = "";
    btn.disabled = false;
    console.log("check_hotfix 失败响应:", r);
    return;
  }
  if (!d.has_update) {
    st.textContent = "功能已是最新（v" + (d.version || "?") + "）";
    st.className = "sidebar-foot-status ok";
    btn.disabled = false;
    setTimeout(() => { if (st.textContent.startsWith("功能已是最新")) { st.hidden = true; st.textContent = ""; } }, 5000);
    return;
  }
  st.textContent = `发现功能更新 v${d.version}（${(d.changed || []).length} 个文件）`;
  st.className = "sidebar-foot-status warn";
  btn.textContent = "应用功能更新";
  btn.disabled = false;
}
async function hotfixMiniApply() {
  const btn = $("hotfixMiniBtn"), st = $("hotfixMiniStatus");
  if (!confirm("应用功能热更新？\n将下载并替换运行时代码，完成后自动重启应用。")) return;
  btn.disabled = true; st.textContent = "正在下载并应用，完成后自动重启…"; st.className = "";
  const r = await call("apply_hotfix", "POST", {}, 30000);
  st.textContent = (r.data && r.data.message) || r.message || "完成";
  if (r.success && r.data && r.data.restarting) { setTimeout(() => location.reload(), 12000); return; }
  btn.disabled = false;
}

/* ── tab 切换 ── */
document.querySelectorAll(".nav button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".nav button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    $("pageTitle").textContent = TITLES[b.dataset.tab] || "";
    document.querySelectorAll(".content section").forEach((s) => (s.hidden = true));
    $("tab-" + b.dataset.tab).hidden = false;
    if (b.dataset.tab === "history") logPoll();
  });
});

/* ── 初始化 ── */
["cfgEnabled", "cfgCron", "cfgRetry", "cfgNotify", "cfgWebhook"].forEach((id) => {
  $(id).addEventListener("change", () => {
    $("cfgSaveBtn").textContent = "保存设置（有更改）";
    cfgDirty = true;
  });
});
let cfgDirty = false;
loadAll();
// 实时日志轮询（4s；进入日志页时立即拉取）
logState.timer = setInterval(logPoll, 4000);
setInterval(() => { call("get_config").then((r) => { if (r.success) updateChip(!!r.data.enabled); }); }, 30000);
</script>
