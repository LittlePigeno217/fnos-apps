<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>签到工具</title>
<style>
:root{
  --bg:#0f1115; --surface:#171a21; --surface2:#1e222b; --border:#2a2f3a;
  --text:#e8eaf0; --muted:#9aa3b2; --accent:#4f8cff; --accent-strong:#7ab0ff;
  --ok:#3fb950; --err:#f85149; --warn:#d29922;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;min-height:100vh}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.grow{flex:1}

/* ── 布局：侧边栏 + 主区（对齐 115网盘助手）── */
.layout{display:flex;min-height:100vh}
.sidebar{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--border)}
.brand svg{width:24px;height:24px;color:var(--accent-strong)}
.brand-name{font-size:15px;font-weight:700;line-height:1.2}
.brand-sub{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;
  color:var(--muted);cursor:pointer;font-size:13.5px;border-radius:8px;text-align:left;width:100%;transition:background .15s}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.active{background:var(--surface2);color:var(--accent-strong)}
.sidebar-foot{padding:12px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sidebar-foot .ver{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.hotfix-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 20px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
#pageTitle{font-size:16px;font-weight:700}
.capsule{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:20px;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.capsule .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.capsule.on .dot{background:var(--ok)}
.capsule.on{color:var(--ok);border-color:var(--ok)}
.top-version{margin-left:auto;font-size:12px;color:var(--muted)}

.content{flex:1;padding:20px;max-width:960px;width:100%}
section[hidden]{display:none}
.pane{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.pane h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pane h3 svg{width:18px;height:18px;color:var(--accent-strong)}
.section-desc{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;line-height:1.6}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:transparent;border-color:var(--err);color:var(--err)}
.btn.btn-mini{padding:4px 10px;font-size:12px}
.input{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:8px 10px;font-size:13px;outline:none;min-width:0}
.input:focus{border-color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* 站点独立配置卡片 */
.site-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--surface2)}
.site-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.site-avatar{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2E8BF0,#1663D6);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.site-title{min-width:0}
.site-name{font-weight:600;font-size:14.5px}
.site-sub{font-size:12px;color:var(--muted)}
.site-mode{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 6px}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:.2s}
.switch .track::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--muted);top:2px;left:2px;transition:.2s}
.switch input:checked+.track{background:var(--accent);border-color:var(--accent)}
.switch input:checked+.track::after{transform:translateX(18px);background:#fff}
.site-cfg{border-top:1px dashed var(--border);padding-top:10px}
.cfg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.cfg-label{width:88px;flex:none;color:var(--muted);font-size:12.5px}
.site-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.result-line{font-size:13px;margin-top:8px}
.result-line.ok{color:var(--ok)}
.result-line.err{color:var(--err)}
.result-line.muted{color:var(--muted)}
.recent{font-size:12px;color:var(--muted);margin-left:auto}

/* 设置 */
.settings-grid{display:flex;flex-direction:column;gap:10px}
.setting-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.setting-label{width:88px;flex:none;color:var(--muted);font-size:13px}
.save-row{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:6px}

/* 历史 */
.history-list{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.history-item{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;padding:6px 8px;border-radius:6px;background:var(--surface2);line-height:1.5}
.history-item .st{flex:none;min-width:76px;text-align:center;border-radius:4px;padding:1px 4px;font-size:12px}
.st.ok{color:var(--ok);background:rgba(63,185,80,.12)}
.st.dup{color:var(--warn);background:rgba(210,153,34,.12)}
.st.err{color:var(--err);background:rgba(248,81,73,.12)}
.history-item .msg{flex:1;min-width:0;word-break:break-all}
.history-item .tm{flex:none;color:var(--muted);font-size:11.5px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}

@media (max-width:720px){
  .sidebar{width:64px}
  .brand-name,.brand-sub,.nav button span{display:none}
  .nav button{justify-content:center}
  .sidebar-foot .ver{font-size:10px}
  .hotfix-status{display:none}
  .content{padding:14px 12px}
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
      <div><span class="brand-name">签到工具</span><span class="brand-sub">FLZT · 恩山 · 易破解</span></div>
    </div>
    <nav class="nav">
      <button data-tab="sites" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 2-1 3-2.5 3H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>站点签到</span>
      </button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.5a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.5a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        <span>运行设置</span>
      </button>
      <button data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>签到历史</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <span class="ver" id="appVersion">v1.0.0</span>
      <div class="hotfix-line">
        <button class="btn btn-mini" id="hotfixMiniBtn" onclick="hotfixMiniClick()" title="检查并应用功能更新（免 fpk）">检查功能更新</button>
        <span class="hotfix-status muted" style="font-size:11px" id="hotfixStatus"></span>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span id="pageTitle">站点签到</span>
      <span class="capsule" id="appCapsule"><span class="dot"></span><span id="appCapsuleText">加载中…</span></span>
      <span class="top-version" id="topVersion"></span>
    </div>

    <div class="content">
      <!-- 站点签到 -->
      <section id="tab-sites" class="pane">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 2-1 3-2.5 3H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>站点配置</h3>
        <p class="section-desc">每个站点独立启用与配置：凭据（账号密码或 Cookie）、代理开关。凭据仅存本机，留空保存 = 保持当前。</p>
        <div class="toolbar">
          <button class="btn primary" onclick="runAll()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M21 8a9 9 0 1 0 1 7"/></svg>
            立即签到全部
          </button>
          <span class="muted" id="runSummary"></span>
          <span class="grow"></span>
          <span class="muted" id="runStatus"></span>
        </div>
        <div id="siteCards"></div>
        <div class="result-line" id="runResult" style="margin-top:8px"></div>
      </section>

      <!-- 运行设置 -->
      <section id="tab-settings" class="pane" hidden>
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.5a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.5a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>运行设置</h3>
        <div class="settings-grid">
          <div class="setting-row">
            <span class="setting-label">应用启用</span>
            <label class="switch"><input type="checkbox" id="cfgEnabled"><span class="track"></span></label>
            <span class="muted" style="font-size:12.5px">关闭后不再自动签到，可手动签到</span>
          </div>
          <div class="setting-row">
            <span class="setting-label">每日时刻</span>
            <input class="input mono" type="text" id="cfgCron" placeholder="08:10" style="max-width:110px">
            <span class="muted" style="font-size:12.5px">每天自动签到时刻（HH:MM）；错过每 30 分钟补签，当天最多 5 次</span>
          </div>
          <div class="setting-row">
            <span class="setting-label">失败重试</span>
            <input class="input mono" type="text" id="cfgRetry" placeholder="3" style="max-width:90px">
            <span class="muted" style="font-size:12.5px">站点签到失败时的重试次数（1-10）</span>
          </div>
          <div class="setting-row">
            <span class="setting-label">飞书通知</span>
            <label class="switch"><input type="checkbox" id="cfgNotify"><span class="track"></span></label>
            <span class="muted" style="font-size:12.5px">签到结果推送到飞书机器人</span>
          </div>
          <div class="setting-row">
            <span class="setting-label">Webhook</span>
            <input type="password" class="input grow" id="cfgWebhook" placeholder="已配置请留空" style="max-width:320px">
          </div>
        </div>
        <div class="save-row">
          <span class="muted" id="cfgStatus"></span>
          <button class="btn primary" id="cfgSaveBtn" onclick="saveSettings()">保存设置</button>
        </div>
      </section>

      <!-- 签到历史 -->
      <section id="tab-history" class="pane" hidden>
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>签到历史
          <span class="grow"></span>
          <button class="btn btn-mini" onclick="clearHistory()">清空</button>
        </h3>
        <div class="history-list" id="historyList"><p class="empty">加载中…</p></div>
      </section>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
async function call(path, method = "GET", body = null, timeoutMs = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const opt = { method, headers: {}, signal: ctrl.signal };
    if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    const r = await fetch(path, opt);
    try { return await r.json(); } catch { return { success: false, message: "响应解析失败" }; }
  } catch (e) {
    return { success: false, message: "请求超时或网络异常" };
  } finally {
    clearTimeout(timer);
  }
}

const TITLES = { sites: "站点签到", settings: "运行设置", history: "签到历史" };

/* ── 站点定义（对齐上游插件配置项：enabled / use_proxy / 凭据）── */
const SITES = {
  flzt: {
    name: "FLZT", mode: "账号密码", short: "FL",
    desc: "flzt.club · 账号密码登录后调用签到 API",
    fields: [
      { key: "email", label: "账号/邮箱", secret: false, ph: "name@example.com" },
      { key: "password", label: "密码", secret: true, ph: "输入新密码（留空不改）" },
    ],
  },
  right_forum: {
    name: "恩山无线论坛", mode: "Cookie", short: "恩",
    desc: "right.com.cn · Cookie 签到（formhash + 人机验证识别）",
    fields: [
      { key: "cookie", label: "Cookie", secret: true, ph: "粘贴浏览器 Cookie（留空不改）" },
    ],
  },
  ypojie: {
    name: "易破解", mode: "账号密码", short: "易",
    desc: "ypojie.com · WordPress 登录后 AJAX 签到",
    fields: [
      { key: "email", label: "账号/邮箱", secret: false, ph: "name@example.com" },
      { key: "password", label: "密码", secret: true, ph: "输入新密码（留空不改）" },
    ],
  },
};
let siteCfg = {};

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderSiteCards(serverSites) {
  const box = $("siteCards");
  box.innerHTML = "";
  for (const [key, info] of Object.entries(SITES)) {
    const st = (serverSites && serverSites[key]) || {};
    siteCfg[key] = { enabled: !!st.enabled, use_proxy: !!st.use_proxy, email: "", password: "", cookie: "" };
    const fields = `
      <div class="cfg-row" style="margin-top:2px">
        <span style="font-size:12.5px;font-weight:600;color:var(--text)">站点凭据</span>
        <span class="muted" style="font-size:11px">留空保存 = 保持当前</span>
      </div>
      ${info.fields.map((f) => `
      <div class="cfg-row">
        <span class="cfg-label">${f.label}</span>
        <input class="input mono grow" type="${f.secret ? "password" : "text"}" id="site_${key}_${f.key}" data-site="${key}" data-field="${f.key}" placeholder="${f.ph}">
      </div>`).join("")}
      <div class="cfg-row">
        <span class="cfg-label">代理访问</span>
        <label class="switch" style="width:36px;height:20px"><input type="checkbox" id="px_${key}" onchange="siteDirty('${key}')"><span class="track"></span></label>
        <span class="muted" style="font-size:12px">经 https_proxy / all_proxy 环境变量代理访问</span>
      </div>
    `;
    box.insertAdjacentHTML("beforeend", `
      <div class="site-card" id="card_${key}">
        <div class="site-head">
          <div class="site-avatar">${info.short}</div>
          <div class="site-title">
            <span class="site-name">${esc(info.name)}</span>
            <span class="site-sub">${esc(info.desc)}</span>
          </div>
          <span class="site-mode">${info.mode}</span>
          <span class="grow"></span>
          <span class="muted" style="font-size:12px" id="account_${key}"></span>
          <label class="switch" title="启用本站点"><input type="checkbox" id="sw_${key}" onchange="siteDirty('${key}')"><span class="track"></span></label>
        </div>
        <div class="site-cfg">${fields}</div>
        <div class="site-actions">
          <button class="btn btn-mini" onclick="testSite('${key}')">测试连接</button>
          <button class="btn btn-mini primary" onclick="runSite('${key}')">立即签到</button>
          <span class="result-line muted" id="res_${key}" style="margin-top:0"></span>
          <span class="recent" id="recent_${key}"></span>
        </div>
      </div>`);
    const accEl = $("account_" + key);
    if (!st.configured) {
      // 未配置凭据：醒目标识，引导到下方「站点凭据」区填写
      accEl.textContent = "⚠ 未配置凭据";
      accEl.style.color = "#d29922";
    } else {
      accEl.textContent = st.enabled ? (st.account || "已配置") : "已配置";
      accEl.style.color = "";
    }
    $("sw_" + key).checked = !!st.enabled;
    $("px_" + key).checked = !!st.use_proxy;
  }
}

function siteDirty(key) {
  siteCfg[key].enabled = $("sw_" + key).checked;
  siteCfg[key].use_proxy = $("px_" + key).checked;
  $("res_" + key).textContent = "";
}

function collectSitePatch(key) {
  const p = { enabled: $("sw_" + key).checked, use_proxy: $("px_" + key).checked };
  for (const f of SITES[key].fields) {
    const v = $("site_" + key + "_" + f.key).value.trim();
    if (v) p[f.key] = v;
  }
  return p;
}

/* ── 加载/保存 ─────────────────────────────────── */
async function loadAll(attempt = 1) {
  const r = await call("get_config");
  if (!r.success) {
    // 网关瞬时故障时自动重试一次，避免页面一直「加载中…」
    if (attempt < 2) { setTimeout(() => loadAll(attempt + 1), 1500); return; }
    return;
  }
  const d = r.data;
  $("cfgEnabled").checked = !!d.enabled;
  $("cfgCron").value = d.cron || "08:10";
  $("cfgRetry").value = d.retry_count || "3";
  $("cfgNotify").checked = !!d.notify_enabled;
  $("topVersion").textContent = "功能 v" + (d.version || "1.0.0");
  $("appVersion").textContent = "v" + (d.version || "1.0.0");
  renderSiteCards(d.sites);
  updateCapsule(!!d.enabled);
  refreshHistory();
}
async function saveSettings() {
  const cron = $("cfgCron").value.trim();
  if (!/^\d{2}:\d{2}$/.test(cron)) { alert("每日时刻格式应为 HH:MM"); return; }
  const retry = parseInt($("cfgRetry").value.trim(), 10);
  if (!Number.isFinite(retry) || retry < 1 || retry > 10) { alert("失败重试应为 1-10 的数字"); return; }
  const sites = {};
  for (const key of Object.keys(SITES)) sites[key] = collectSitePatch(key);
  const body = {
    enabled: $("cfgEnabled").checked === true,
    cron, retry_count: retry,
    notify_enabled: $("cfgNotify").checked === true,
    sites,
  };
  const w = $("cfgWebhook").value.trim();
  if (w) body.feishu_webhook = w;
  const r = await call("save_config", "POST", body);
  const st = $("cfgStatus");
  if (r.success) {
    st.textContent = "已保存 ✓";
    $("cfgWebhook").value = "";
    setTimeout(() => { st.textContent = ""; $("cfgSaveBtn").textContent = "保存设置"; }, 2000);
    loadAll();
  } else {
    alert("保存失败：" + (r.message || ""));
  }
}

function updateCapsule(on) {
  const cap = $("appCapsule");
  cap.classList.toggle("on", !!on);
  $("appCapsuleText").textContent = on ? "自动签到已开启" : "未启用";
}

/* ── 签到执行 ─────────────────────────────────── */
async function runSite(key) {
  $("res_" + key).textContent = "保存配置并签到中…"; $("res_" + key).className = "result-line muted";
  // 像插件一样：先用当前表单填写值保存，再签到
  const saved = await call("save_config", "POST", { sites: { [key]: collectSitePatch(key) } });
  if (!saved.success) { $("res_" + key).textContent = "✗ 配置保存失败：" + (saved.message || ""); $("res_" + key).className = "result-line err"; return; }
  const r = await call("run", "POST", { sites: [key] });
  const data = r.data || {};
  const item = (data.results || []).find((x) => x.site_key === key);
  const line = $("res_" + key);
  if (item && item.error) { line.textContent = "✗ " + item.error; line.className = "result-line err"; }
  else if (item) { line.textContent = (item.status === "签到成功" ? "✓ " : "○ ") + item.message; line.className = "result-line " + (item.status === "签到成功" ? "ok" : ""); }
  else { line.textContent = r.message || "无结果"; line.className = "result-line err"; }
  refreshHistory();
}
async function runAll() {
  $("runStatus").textContent = "执行中…";
  $("runResult").textContent = "";
  const r = await call("run", "POST", {});
  const data = r.data || {};
  const lines = (data.results || []).map((x) => {
    if (x.error) return "✗ " + x.site_name + "：" + x.error;
    return (x.status === "签到成功" ? "✓ " : "○ ") + x.site_name + "：" + x.message;
  });
  $("runResult").textContent = lines.join("\n") || (r.message || "未执行");
  $("runResult").className = "result-line " + (data.success_count > 0 && data.results.every((x) => x.status !== "执行失败") ? "ok" : "err");
  $("runSummary").textContent = data.summary ? `${data.summary}（${data.success_count}/${data.total}）` : "";
  $("runStatus").textContent = "";
  refreshHistory();
}

async function testSite(key) {
  const line = $("res_" + key);
  line.textContent = "保存配置并测试中…"; line.className = "result-line muted";
  // 像插件一样：先用当前表单填写值保存，再测试（未保存也能直接测）
  const saved = await call("save_config", "POST", { sites: { [key]: collectSitePatch(key) } });
  if (!saved.success) { line.textContent = "✗ 配置保存失败：" + (saved.message || ""); line.className = "result-line err"; return; }
  const r = await call("test_login", "POST", { site: key });
  line.textContent = r.success ? "✓ " + (r.data.message || "测试成功") : "✗ " + (r.message || "测试失败");
  line.className = "result-line " + (r.success ? "ok" : "err");
}

/* ── 历史 ─────────────────────────────────────── */
async function refreshHistory() {
  const r = await call("history?limit=20");
  const box = $("historyList");
  const records = (r.data && r.data.records) || [];
  if (!records.length) { box.innerHTML = '<p class="empty">暂无签到记录</p>'; return; }
  box.innerHTML = records.map((h) => {
    const cls = h.status === "签到成功" ? "ok" : h.status === "今日已签到" ? "dup" : "err";
    const msg = h.error || h.message || h.status;
    return `<div class="history-item">
      <span class="st ${cls}">${esc(h.status)}</span>
      <span class="msg"><b>${esc(h.site_name)}</b>：${esc(msg)}</span>
      <span class="tm">${esc(h.time)}</span>
    </div>`;
  }).join("");
}
async function clearHistory() {
  if (!confirm("清空全部签到历史？")) return;
  await call("history/clear", "POST", {});
  refreshHistory();
}

/* ── 热更新（左下角，功能版本） ────────────────── */
let hotfixState = { has_update: false, version: "" };
async function hotfixMiniClick() {
  if (hotfixState.has_update) return hotfixMiniApply();
  await hotfixMiniCheck();
}
async function hotfixMiniCheck() {
  const btn = $("hotfixMiniBtn"), st = $("hotfixStatus");
  btn.disabled = true; st.textContent = "检查中…";
  const r = await call("check_hotfix", "GET", null, 20000);
  const d = r.data || {};
  hotfixState.has_update = !!d.has_update;
  hotfixState.version = d.version || "";
  if (!r.success) { st.textContent = (r.message || "检查失败") + "，稍后重试"; btn.disabled = false; return; }
  if (!d.has_update) {
    st.textContent = "功能已是最新（v" + (d.version || "?") + "）";
    btn.disabled = false;
    setTimeout(() => { if (st.textContent.startsWith("功能已是最新")) st.textContent = ""; }, 5000);
    return;
  }
  st.textContent = `发现功能更新 v${d.version}（${(d.changed || []).length} 个文件）`;
  btn.textContent = "应用功能更新";
  btn.disabled = false;
}
async function hotfixMiniApply() {
  const btn = $("hotfixMiniBtn"), st = $("hotfixStatus");
  if (!confirm("应用功能热更新？\n将下载并替换运行时代码，完成后自动重启应用。")) return;
  btn.disabled = true; st.textContent = "正在下载并应用，完成后自动重启…";
  const r = await call("apply_hotfix", "POST", {}, 30000);
  st.textContent = (r.data && r.data.message) || r.message || "完成";
  if (r.success && r.data && r.data.restarting) { setTimeout(() => location.reload(), 12000); return; }
  btn.disabled = false;
}

/* ── tab 切换 ─────────────────────────────────── */
document.querySelectorAll(".nav button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".nav button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    $("pageTitle").textContent = TITLES[b.dataset.tab] || "";
    document.querySelectorAll(".content section").forEach((s) => (s.hidden = true));
    $("tab-" + b.dataset.tab).hidden = false;
    if (b.dataset.tab === "history") refreshHistory();
  });
});

/* ── 初始化 ───────────────────────────────────── */
["cfgEnabled", "cfgCron", "cfgRetry", "cfgNotify", "cfgWebhook"].forEach((id) => {
  $(id).addEventListener("change", () => { $("cfgSaveBtn").textContent = "保存设置（有更改）"; $("cfgStatus").textContent = "有未保存的更改"; });
});
loadAll();
setInterval(() => { call("get_config").then((r) => { if (r.success) updateCapsule(!!r.data.enabled); }); }, 30000);
</script>
</body>
